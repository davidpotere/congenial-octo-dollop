<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,500;1,9..144,300&family=Inter:wght@400;500;600&display=swap">
<style>
  :root { --paper: #f7f3ea; --ink: #1d1b16; --ink-2: #5d574b; --ink-3: #958d7d; --line: #e4dccb; --accent: #b5762a;
          --bird: #3f8a4f; --bat: #6b52c4; --critter: #c0602d; --sky: #2b4f9a; --rain: #2f7ac4; --alert: #c4442f; }
  @media (prefers-color-scheme: dark) { :root { --paper: #12141c; --ink: #f1ece0; --ink-2: #b9b2a2; --ink-3: #7f7a6e; --line: #2a2d38;
          --accent: #f0c26b; --bird: #8fd69c; --bat: #b49cff; --critter: #ffad7e; --sky: #9cb8ff; --rain: #7cbcff; --alert: #ff8b7a; } }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--paper); color: var(--ink); font: 16px/1.6 "Inter", system-ui, sans-serif; -webkit-font-smoothing: antialiased; }
  .wrap { max-width: 720px; margin: 0 auto; padding: 0 20px 64px; }
  .hero { position: relative; min-height: 340px; display: flex; align-items: flex-end; color: #fff; overflow: hidden;
          background: linear-gradient(170deg, #1d2a5c, #c46e5a 70%, #f0b278); }
  .hero img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
  .hero::after { content: ""; position: absolute; inset: 0; background: linear-gradient(transparent 30%, rgba(0,0,0,.62)); }
  .hero .wrap { position: relative; z-index: 1; padding-top: 80px; padding-bottom: 28px; width: 100%; }
  .kicker { font-size: 12px; letter-spacing: .16em; text-transform: uppercase; opacity: .85; }
  h1 { font: 300 clamp(34px, 7vw, 54px)/1.05 "Fraunces", Georgia, serif; margin: 8px 0 0; letter-spacing: -.015em; text-wrap: balance; }
  .sub { font: italic 300 20px/1.4 "Fraunces", Georgia, serif; margin: 10px 0 0; opacity: .92; }
  .lede { font: 300 21px/1.55 "Fraunces", Georgia, serif; margin: 32px 0 8px; }
  h2 { font: 500 24px/1.2 "Fraunces", Georgia, serif; margin: 40px 0 8px; display: flex; gap: 10px; align-items: center; }
  h2 i { width: 10px; height: 10px; border-radius: 50%; display: inline-block; background: var(--accent); flex: none; }
  p { margin: 0 0 14px; }
  .muted { color: var(--ink-2); }
  .listen { display: flex; align-items: center; gap: 14px; margin: 26px 0 0; padding: 14px 16px; border: 1px solid var(--line); border-radius: 16px; }
  .listen audio { width: 100%; }
  .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 12px; margin: 30px 0 0; }
  .stat { padding: 14px 16px; border: 1px solid var(--line); border-radius: 16px; }
  .stat b { display: block; font: 400 30px/1.1 "Fraunces", Georgia, serif; }
  .stat span { font-size: 12px; letter-spacing: .08em; text-transform: uppercase; color: var(--ink-3); }
  .media { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 10px; margin: 14px 0 6px; }
  figure { margin: 0; }
  figure img { width: 100%; aspect-ratio: 4/3; object-fit: cover; border-radius: 14px; display: block; background: var(--line); }
  figcaption { font-size: 13px; color: var(--ink-2); margin-top: 4px; }
  figure audio { width: 100%; margin-top: 4px; height: 32px; }
  .callout { margin: 36px 0 0; padding: 20px 22px; border-radius: 18px; background: color-mix(in srgb, var(--accent) 12%, transparent); }
  .callout h3 { margin: 0 0 6px; font: 600 12px/1.3 "Inter"; letter-spacing: .14em; text-transform: uppercase; color: var(--accent); }
  .callout p { margin: 0; font: 300 19px/1.5 "Fraunces", Georgia, serif; }
  .days { display: grid; grid-template-columns: repeat(auto-fit, minmax(84px, 1fr)); gap: 8px; margin: 14px 0; }
  .days div { text-align: center; padding: 10px 6px; border: 1px solid var(--line); border-radius: 12px; font-size: 13px; }
  .days b { display: block; font: 400 20px "Fraunces", Georgia, serif; }
  .chart { width: 100%; height: auto; margin: 10px 0 0; }
  .chart text { font: 11px "Inter"; fill: var(--ink-3); }
  footer { margin-top: 56px; padding-top: 18px; border-top: 1px solid var(--line); font-size: 13px; color: var(--ink-3); }
  a { color: inherit; text-underline-offset: 3px; }
</style>
